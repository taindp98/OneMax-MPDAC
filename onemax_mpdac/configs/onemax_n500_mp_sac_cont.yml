experiment:
    n_cores:                        1
    log_level:                      1
    n_episodes:                     100000
    n_steps:                        200000
    save_interval:                  2000
    eval_interval:                  2000
    eval_n_episodes:                100    

bench:
    name:                           "OLLGATheoryPPO"
    discrete_action:                False
    rescale_action:                 True
    action_bounds:
        - [-1, 1]
        - [-1, 1]
        - [-1, 1]
        - [-1, 1]
    problem:                        "OneMax"
    instance_set_path:              "om_ollga_500_medium.csv"
    observation_description:        "n,f(x)"
    reward_choice:                  "imp_minus_evals_shifting"
    seed:                           0
    
eval_env:
    reward_choice:                  "minus_evals"
    
agent:
    name:                           "sac"
    epsilon:                        0.2
    begin_learning_after:           10000

